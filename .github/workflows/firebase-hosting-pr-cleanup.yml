name: Delete the Firebase Hosting preview channel when a PR closes

# The preview deploy runs on the default pull_request types, which do not
# include `closed`, so a merged PR's channel used to wait out its TTL. With
# sixty-odd merges a fortnight that put the site over Hosting's 50-channel
# cap, and every open PR's preview then failed with a 429. This is its own
# workflow rather than a `closed` type on the deploy one, so the deploy job
# never has to reason about whether it is being asked to build a closed PR.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete_preview_channel:
    # Same guard as the deploy: a fork's PR never got a channel, and the
    # service-account secret is not exposed to fork workflows anyway.
    if: github.repository == 'sean1093/LittleSteps' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Both hosting:channel:* commands run `requireConfig` and refuse to start
      # without a firebase.json in the working directory -- "Not in a Firebase
      # app directory". The deploy job has one because it checks out the repo;
      # this job needs the same one file. The ref is pinned because on a
      # `closed` event GITHUB_REF is the base branch for a merged PR and
      # refs/pull/N/merge for an unmerged one; the base branch is what we want
      # either way.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          # package-lock.json comes along for the version pin below; this job
          # never runs `npm ci`, so it is read, not installed from.
          sparse-checkout: |
            firebase.json
            package-lock.json
          sparse-checkout-cone-mode: false

      - name: Work out the channel the deploy action created
        id: channel
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # Mirrors FirebaseExtended/action-hosting-deploy's getChannelId.ts
          # for a pull_request event: `pr<number>-<branch>`, the branch cut to
          # its first 20 characters, and every character outside
          # [a-zA-Z0-9_.-] replaced with an underscore. If that file changes,
          # this must change with it, or the delete silently finds nothing.
          #
          # In node, not cut/sed: `cut -c` counts bytes and sed's `.` matches a
          # byte, so a branch with a CJK character in it -- legal on GitHub,
          # and plausible in this repo -- would come out three underscores
          # per character here and one in the action, and the names would
          # never match. `.slice(0, 20)` is the same UTF-16 cut the action does.
          #
          # Then the CLI's own rewrite, which the action's id goes through before
          # anything is created: `hosting:channel:deploy` calls normalizeName()
          # (firebase-tools src/hosting/api.ts), which turns every `/`, `:`, `_`
          # and `#` into `-`. So the action derives `pr116-chore_preview-channe`
          # and the site stores `pr116-chore-preview-channe`. The list below
          # returns the stored form, and a comparison against the action's form
          # matches nothing on every branch with a `/` in it -- which is every
          # branch in this repo -- and the job would say "nothing to do", green,
          # forever. Review of #116 caught it from this PR's own deploy log.
          id="$(node -e '
            const branch = process.env.HEAD_REF.slice(0, 20);
            const fromAction = `pr${process.env.PR_NUMBER}-${branch}`.replace(/[^a-zA-Z0-9_\-\.]/g, "_");
            process.stdout.write(fromAction.replace(/[/:_#]/g, "-"));
          ')"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Delete it if it still exists
        env:
          CHANNEL_ID: ${{ steps.channel.outputs.id }}
        run: |
          set -euo pipefail
          # Pinned to the lockfile, like every other firebase-tools call site.
          # This one matters most: `hosting:channel:deploy` and
          # hosting:channel:list/delete must agree on how a channel id is
          # normalised, and they are two different CLI processes on two
          # different runners. Letting one of them float to `latest` is how a
          # cleanup job starts silently deleting nothing.
          # Two lines, not one: `set -e` aborts on a command substitution used as
          # an assignment, but NOT on one used as an argument. Inline, a missing
          # or restructured lockfile would make this `firebase-tools@`, npm reads
          # an empty spec as `latest`, and the job installs whatever shipped this
          # morning while staying green -- the #116 failure class, in the step
          # whose comment invokes it. Assignment first, so the step dies instead.
          version="$(node -p "require('./package-lock.json').packages['node_modules/firebase-tools'].version")"
          npm install -g "firebase-tools@$version"
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LITTLESTEPS_C6AB6 }}' > "$HOME/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/firebase-service-account.json"

          # List first, then delete only what is there. A channel that already
          # expired, or a PR whose deploy never ran, is not a failure -- but a
          # broken credential or a CLI error must still turn this red, which
          # `|| true` around the delete would hide.
          channels="$(firebase hosting:channel:list --project littlesteps-c6ab6 --json)"
          # Not inside `if ...; then`: an if-condition swallows every non-zero
          # exit as "false", so the shape guard's exit 2 would have landed in
          # the "nothing to do" branch and the step would have stayed green.
          # 0 = present, 1 = absent, anything else = the guard itself failed.
          rc=0
          printf '%s' "$channels" | node -e '
            // A CLI that crashed before printing anything must not read as
            // "channel absent": an uncaught JSON.parse throw exits 1, which the
            // case below treats as absent. Parse failure is a guard failure.
            const raw = require("fs").readFileSync(0, "utf8");
            let out;
            try { out = JSON.parse(raw); } catch { console.error("channel list is not JSON:", JSON.stringify(raw.slice(0, 300))); process.exit(2); }
            // --json wraps the command result as { status, result }; accept the
            // bare shape too, so a CLI that stops wrapping does not turn this
            // into a permanent silent no-op.
            const channels = (out.result ?? out).channels;
            if (!Array.isArray(channels)) { console.error("unexpected channel list shape:", JSON.stringify(out).slice(0, 300)); process.exit(2); }
            const ids = channels.map((c) => c.name.split("/").pop());
            process.exit(ids.includes(process.env.CHANNEL_ID) ? 0 : 1);
          ' || rc=$?
          case "$rc" in
            0)
              firebase hosting:channel:delete "$CHANNEL_ID" --project littlesteps-c6ab6 --force
              echo "Deleted $CHANNEL_ID"
              ;;
            1)
              echo "$CHANNEL_ID is not on the site (already expired, or never deployed); nothing to do"
              ;;
            *)
              exit "$rc"
              ;;
          esac
