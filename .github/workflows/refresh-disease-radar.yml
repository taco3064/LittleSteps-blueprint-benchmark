name: Refresh disease radar data

# Manual only, and only useful on a runner that can reach Taiwan CDC.
#
# od.cdc.gov.tw (35.229.205.172) is unreachable from GitHub-hosted runners: two
# workflow_dispatch runs both died with `connect ETIMEDOUT 35.229.205.172:443`
# after about 2m17s each, without ever completing a TCP handshake. The same IP
# answers from a machine in Taiwan and resolves to the same address from both,
# so this is the source IP being blocked (GitHub runners live on Azure) and not
# DNS geo-splitting.
#
# A cron schedule would therefore deliver one failure email a week until nobody
# reads them. The weekly refresh is a local command instead — see the disease
# radar part of the data section in README.md. Taiwan CDC publishes the previous
# week early on Monday or Tuesday, so run it from Wednesday onwards.
#
# This workflow stays for the day a self-hosted runner with a Taiwan route
# exists: dispatch it with `runner` set to that label and everything below works
# unchanged. On ubuntu-latest each download now gives up after 20s with a stated
# reason instead of hanging for over two minutes.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label — ubuntu-latest cannot reach od.cdc.gov.tw'
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - self-hosted

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'sean1093/LittleSteps'
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No npm ci: buildDiseaseRadar.cjs only uses node builtins (fs / https / path / tls).
      - name: Rebuild diseaseRadar.json
        id: rebuild
        run: node scripts/buildDiseaseRadar.cjs

      - name: Explain an unreachable source
        if: failure() && steps.rebuild.outcome == 'failure'
        run: |
          {
            echo '## Could not fetch the Taiwan CDC data'
            echo
            echo '`od.cdc.gov.tw` blocks source IPs outside Taiwan, and every'
            echo 'GitHub-hosted runner is one. Nothing was written, so the live'
            echo 'board still shows last week rather than an empty board.'
            echo
            echo 'Refresh it from a machine on a Taiwan network:'
            echo
            echo '```bash'
            echo 'node scripts/buildDiseaseRadar.cjs'
            echo 'node scripts/diffDiseaseRadar.cjs   # 0 same / 1 changed / 2 cannot compare'
            echo '```'
            echo
            echo 'Commit `public/data/diseaseRadar.json` only on exit 1.'
          } >> "$GITHUB_STEP_SUMMARY"

      # A CSV that fails to download, or parses to 0 rows, exits non-zero above
      # and writes nothing, so this step never runs — the live board keeps last
      # week instead of turning into an empty one.
      #
      # Not `git diff --quiet`: every rebuild writes a fresh generatedAt and
      # verifiedOn, so git always reports a change and a schedule would commit a
      # week of nothing. diffDiseaseRadar.cjs strips those two fields before
      # comparing and reuses git diff's exit codes (0 same / 1 changed / 2 cannot
      # compare). A 2 is not a 1: when the comparison itself fails, stop red
      # rather than commit a file nobody has verified.
      #
      # Dispatched on the default branch, the push below triggers the existing
      # firebase-hosting-merge.yml, so there is no deploy step here.
      - name: Commit if data changed
        run: |
          status=0
          node scripts/diffDiseaseRadar.cjs || status=$?
          case "$status" in
            0)
              echo "No commit; restoring the timestamps the rebuild wrote"
              git checkout -- public/data/diseaseRadar.json
              ;;
            1)
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add public/data/diseaseRadar.json
              git commit -m "chore: update disease radar data"
              git push
              ;;
            *)
              exit "$status"
              ;;
          esac
