name: CI

on:
  pull_request:
  # `master` runs the whole suite, including @p2. On a pull request the P0 and
  # P1 subset is what blocks the merge; the plan puts the cosmetic cases here so
  # they are still run somewhere rather than only ever locally.
  push:
    branches: [master, benchmark/mf]

permissions:
  contents: read

# A second push to the same pull request supersedes the first. Without this
# both runs finish, and each pays for a container pull and a production build
# to report on a commit nobody is looking at any more.
#
# Master is the exception, and it has to be. Every master push shares one
# `github.ref`, so cancelling would mean a second merge kills the first merge's
# run — leaving that commit unverified, and its conclusion `cancelled` rather
# than `success`, so release.yml would never tag it. Each master commit gets its
# own group and runs to completion.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Nothing ran lint or the unit suite on a pull request before this job: the
  # workflows directory held two Firebase deploys and the manual radar refresh,
  # and the gates were run by hand. It has to exist before the browser suite
  # does, or a Playwright failure becomes this repo's first CI signal and every
  # logic error arrives dressed as a browser error.
  lint-and-unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

  e2e:
    name: E2E (Chromium, 390px and 320px)
    # Sequenced, not parallel: a red unit suite explains a red browser suite,
    # and running both only makes the second failure harder to read.
    needs: lint-and-unit
    runs-on: ubuntu-latest
    # The browsers ship inside this image, at the `PLAYWRIGHT_BROWSERS_PATH` it
    # sets. Nothing here runs `playwright install`, and the tag must stay in
    # step with the `@playwright/test` version pinned in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      # Chromium's default 64 MB /dev/shm in a container is not enough and
      # shows up as a browser that dies mid-test.
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      # No node-version: the image's Node is the one the browsers were
      # installed against. This is here only for the npm cache, without which
      # `npm ci` costs the best part of a minute on every run.
      - name: Cache npm downloads
        uses: actions/setup-node@v4
        with:
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          # The `prepare` script runs `husky install`, which fails in the
          # container with `fatal: not in a git directory`. Nothing here commits.
          HUSKY: '0'

      # The dummy Firebase configuration and the production build live in
      # playwright.config.ts, so there is nothing to set up here and no secret
      # to leak into a fork's pull request.
      # On a pull request, the merge-blocking subset. On master, everything —
      # a @p2 case that runs nowhere is a case nobody maintains.
      - name: Run the E2E suite
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            npm run test:e2e
          else
            npm run test:e2e -- --grep "@p0|@p1"
          fi

      - name: Upload the report, traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # database.rules.json is the only authorisation boundary in the product, and
  # scripts/testRules.cjs against the real Database emulator is the only proof
  # of it. Until this job existed that proof ran only on a machine with a JDK,
  # so a pull request could loosen a rule and arrive green. No `needs:` — the
  # suite exercises the rules file, not the app, so a red unit suite explains
  # nothing about a red rules suite, and the minute it takes runs in parallel.
  # No `paths:` filter either: the assertions encode assumptions the hooks make,
  # so a change to either side has to run them.
  rules:
    name: Database rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # The emulator is a jar. The runner image ships several JDKs and which
      # one is first on PATH is the image's choice, not ours; pinning one keeps
      # the emulator's Java stable across image updates. The emulator wants
      # 11 or later.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # firebase-tools downloads the emulator jar (~35 MB) into this directory
      # on first run. Keyed on the firebase-tools version, not the whole
      # lockfile: the jar version is pinned inside firebase-tools, so only a
      # bump of that package makes the cached jar stale, and an unrelated
      # dependency change should not cost a re-download.
      - name: Resolve the firebase-tools version
        id: firebase-tools
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/firebase-tools'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the emulator jar
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-firebase-tools-${{ steps.firebase-tools.outputs.version }}

      # The `demo-` project prefix is what keeps the emulator offline: a demo
      # project has no real counterpart, so nothing here can reach a live
      # database whatever credentials the runner happens to hold. The script
      # sets a non-zero exit code on any failed assertion and emulators:exec
      # propagates it, so a loosened rule turns this job red.
      - name: Database rules
        run: npm run test:rules
