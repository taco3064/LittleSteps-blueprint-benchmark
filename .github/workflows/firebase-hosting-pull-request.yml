name: Deploy to Firebase Hosting on PR

on: pull_request

# action-hosting-deploy creates a check run and comments the preview URL on the
# PR. This repo's default GITHUB_TOKEN is read-only
# (default_workflow_permissions: read), so without this block the action gets
# 403 Resource not accessible by integration from POST /check-runs. The
# workflow had never run before PR #1, which is why the gap went unnoticed.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build_and_preview:
    if: github.repository == 'sean1093/LittleSteps' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env
          echo "VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}" >> .env
          echo "VITE_FIREBASE_DATABASE_URL=${{ secrets.VITE_FIREBASE_DATABASE_URL }}" >> .env
          # Empty until the owner registers the site key: GitHub renders an unset
          # secret as an empty string, which src/lib/firebase.ts treats as "no
          # App Check".
          echo "VITE_FIREBASE_APPCHECK_SITE_KEY=${{ secrets.VITE_FIREBASE_APPCHECK_SITE_KEY }}" >> .env

      - name: Build
        run: npm run build

      # One source of truth for which firebase-tools every job runs: the
      # lockfile. Pinning each call site to a literal version would be four
      # places to bump and four chances to disagree, and the versions must
      # agree -- the deploy's CLI and the cleanup's CLI both normalise a
      # channel id, and #116 shipped a cleanup job that looked for a name no
      # CLI had ever stored. ci.yml resolves the same value the same way for
      # its emulator cache key.
      - name: Resolve the firebase-tools version
        id: firebase-tools
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/firebase-tools'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Deploy to Firebase Hosting Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LITTLESTEPS_C6AB6 }}'
          projectId: littlesteps-c6ab6
          # Without this the action runs `npx firebase-tools@latest`, so the
          # CLI that creates a preview channel is whatever npm published that
          # morning.
          firebaseToolsVersion: ${{ steps.firebase-tools.outputs.version }}
          # A Hosting site holds at most 50 channels, and the action's default
          # TTL is 7 days from the last push -- so the steady state is "merges in
          # the last week", which crossed 50 once and refused every preview
          # deploy with a 429 nobody could act on from the PR it landed on.
          # Three days keeps an active PR's preview alive across a weekend; a
          # PR untouched for longer loses it until the next push, and the URL
          # in the bot comment goes stale, which is the right trade for a PR
          # that old. firebase-hosting-pr-cleanup.yml deletes the channel when
          # the PR closes, so this TTL only has to cover PRs that are still open.
          expires: 3d
